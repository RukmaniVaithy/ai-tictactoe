<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="background-effect"></div>
    <div class="app-container">
        <header>
            <h1>Tic<span>Tac</span>Toe</h1>
        </header>

        <div class="controls-panel">
            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-pva">1 Player (PvA)</button>
                <button class="mode-btn" id="btn-pvp">Online PvP</button>
            </div>
        </div>

        <div class="lobby-panel hidden" id="lobby-panel">
            <div class="lobby-box">
                <p id="lobby-status">Connecting to network...</p>
                <div class="share-box hidden" id="share-box">
                    <p>Send this link to a friend to connect!</p>
                    <input type="text" id="invite-link" readonly>
                    <button id="copy-btn" class="secondary-btn">Copy Link</button>
                </div>
            </div>
        </div>

        <div class="game-area" id="game-area">
            <div class="scoreboard">
                <div class="score-card player-x">
                    <span class="label" id="label-x">You (X)</span>
                    <span class="score" id="score-x">0</span>
                </div>
                <div class="score-card ties">
                    <span class="label">Ties</span>
                    <span class="score" id="score-ties">0</span>
                </div>
                <div class="score-card player-o">
                    <span class="label" id="label-o">AI (O)</span>
                    <span class="score" id="score-o">0</span>
                </div>
            </div>

            <div class="game-status" id="game-status">Your turn!</div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button class="reset-btn" id="reset-btn">
                Restart Game
            </button>
        </div>
    </div>

    <!-- Modal for game over -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">You Win!</h2>
            <button class="primary-btn" id="modal-btn">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
